# Hub pages whose name is also a folder.
[[redirects]]
  from = "/work"
  to = "/work.html"
  status = 200

[[redirects]]
  from = "/blog"
  to = "/blog.html"
  status = 200

[[redirects]]
  from = "/services"
  to = "/services.html"
  status = 200

[[redirects]]
  from = "/services.html"
  to = "/services"
  status = 301
  force = true

# Trailing-slash variants of the hubs collapse onto the canonical URL.
[[redirects]]
  from = "/work/"
  to = "/work"
  status = 301

[[redirects]]
  from = "/blog/"
  to = "/blog"
  status = 301

[[redirects]]
  from = "/services/"
  to = "/services"
  status = 301

# Generated pages: /services/<slug>, /work/<slug>, /blog/<slug>.
[[redirects]]
  from = "/services/:slug"
  to = "/services/:slug.html"
  status = 200

[[redirects]]
  from = "/work/:slug"
  to = "/work/:slug.html"
  status = 200

[[redirects]]
  from = "/blog/:slug"
  to = "/blog/:slug.html"
  status = 200

# Admin lives at /admin (login) — the panels are noindex and blocked in robots.
[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

# ---- Security headers (site-wide) ----
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Admin pages must never be indexed, whatever the HTML says.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/content-admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# ---- Caching: long-lived for static media, revalidated for code ----
# Images/video in /assets rarely change.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Self-hosted fonts are content-hashed by Google and never change — cache hard.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

# CSS/JS revalidate so design updates appear right after a deploy.
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/llms-full.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"
