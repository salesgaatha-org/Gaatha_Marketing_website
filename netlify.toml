# Netlify configuration — gaa-tha
# Static site served straight from the repository root (index.html at root).
# Generated pages (services/, work/, blog/, sitemap.xml, llms.txt) are
# committed, so no build step is required here; `node build/build.js`
# regenerates them locally or in the GitHub Actions deploy workflow.

[build]
  publish = "."
  command = ""

# ---- Clean URLs -------------------------------------------------------------
# Canonical URLs are extensionless. Netlify serves /foo from foo.html
# natively; these rules 301 the old .html addresses and make sure /work,
# /blog and /services resolve to the page even though a folder of the same
# name now holds the case studies, posts and service pages.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/work.html"
  to = "/work"
  status = 301
  force = true

[[redirects]]
  from = "/blog.html"
  to = "/blog"
  status = 301
  force = true

[[redirects]]
  from = "/faq.html"
  to = "/faq"
  status = 301
  force = true

[[redirects]]
  from = "/about.html"
  to = "/about"
  status = 301
  force = true

[[redirects]]
  from = "/reels.html"
  to = "/reels"
  status = 301
  force = true

[[redirects]]
  from = "/websites.html"
  to = "/websites"
  status = 301
  force = true

[[redirects]]
  from = "/branding.html"
  to = "/branding"
  status = 301
  force = true

[[redirects]]
  from = "/blog-what-is-marketing.html"
  to = "/blog-what-is-marketing"
  status = 301
  force = true

[[redirects]]
  from = "/blog-how-to-do-better-marketing.html"
  to = "/blog-how-to-do-better-marketing"
  status = 301
  force = true

[[redirects]]
  from = "/blog-what-is-graphic-design.html"
  to = "/blog-what-is-graphic-design"
