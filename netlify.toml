[[redirects]]
  from = "/blog-best-digital-marketing-agency-india.html"
  to = "/blog-best-digital-marketing-agency-india"
  status = 301
  force = true

[[redirects]]
  from = "/blog-ai-ads-and-ai-ad-shoots-guide.html"
  to = "/blog-ai-ads-and-ai-ad-shoots-guide"
